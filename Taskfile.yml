---
version: "3"

vars:
  GIT_VERSION:
    sh: git describe --abbrev=0 --tags 2>/dev/null || echo "v0.0.0"

tasks:

  clean:
    cmds:
      - cmd: rm -f -R build
        ignore_error: true

  run:
    env:
      CGO_ENABLED: 1
      GODEBUG: cgocheck=0
      CGO_LDFLAGS: "-luuid"
      CGO_CFLAGS: "-Wno-deprecated"
      CGO_CXXFLAGS: "-Wno-conversion-null"      
    cmds:
      - go run -ldflags "-X github.com/kirsrus/ip2flag/main.version={{.GIT_VERSION}}" --race -v main.go

  build:
    deps: [clean]
    cmds:
      - cmd: mkdir build
        ignore_error: true
      - task: build_windows

  build_windows:
    env:
      GOARCH: amd64
      GOOS: windows
      CGO_ENABLED: 1
      GODEBUG: cgocheck=0
      CGO_LDFLAGS: "-luuid"
      CGO_CFLAGS: "-Wno-deprecated"
      CGO_CXXFLAGS: "-Wno-conversion-null"      
    cmds:
      - go build -ldflags "-X github.com/kirsrus/ip2flag/main.version={{.GIT_VERSION}}" -v -o build/ip2flag.exe main.go
